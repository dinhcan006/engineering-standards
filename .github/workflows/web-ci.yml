# Workflow dùng chung: lint + typecheck + build cho Next.js.
name: web-ci

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: web
      node-version:
        type: string
        default: "22"
    secrets:
      STANDARDS_TOKEN:
        required: false

jobs:
  lint-build:
    name: lint-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4

      # Code dự án tải bằng quyền mặc định của GitHub. Luật chung (submodule standards/) nằm ở
      # repo riêng tư khác nên cần STANDARDS_TOKEN (token CHỈ đọc được repo engineering-standards).
      # Token chỉ dùng cho lệnh này, không lưu lại; dòng extraheader= bỏ header của github.token
      # để git dùng đúng token này khi tải submodule.
      - name: Lấy luật chung (submodule standards/)
        working-directory: .
        env:
          STANDARDS_TOKEN: ${{ secrets.STANDARDS_TOKEN }}
        run: |
          if [ -n "$STANDARDS_TOKEN" ]; then
            AUTH="url.https://x-access-token:${STANDARDS_TOKEN}@github.com/.insteadOf=https://github.com/"
            git -c "http.https://github.com/.extraheader=" -c "$AUTH" submodule update --init --recursive
          else
            git submodule update --init --recursive
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - run: npm ci

      - name: Chặn bỏ qua test
        run: |
          if grep -rnE '\b(test|it|describe)\.(skip|only|fixme)\(' --include=*.ts --include=*.tsx e2e src 2>/dev/null; then
            echo "::error::Không được skip/only test."
            exit 1
          fi

      - name: Lint (không cho phép cảnh báo)
        run: npx eslint . --max-warnings=0

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
