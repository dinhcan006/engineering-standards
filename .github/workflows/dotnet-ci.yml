# Workflow dùng chung: build + phân tích tĩnh + test cho API .NET.
# Dự án gọi: uses: <ORG>/engineering-standards/.github/workflows/dotnet-ci.yml@main
name: dotnet-ci

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: api
      dotnet-version:
        type: string
        default: "10.0.x"
    secrets:
      STANDARDS_TOKEN:
        required: false

jobs:
  build-test:
    name: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4

      # Code dự án tải bằng quyền mặc định của GitHub. Luật chung (submodule standards/) nằm ở
      # repo riêng tư khác nên cần STANDARDS_TOKEN (token CHỈ đọc được repo engineering-standards).
      # Token chỉ dùng cho lệnh này, không lưu lại; dòng extraheader= bỏ header của github.token
      # để git dùng đúng token này khi tải submodule.
      - name: Lấy luật chung (submodule standards/)
        working-directory: .
        env:
          STANDARDS_TOKEN: ${{ secrets.STANDARDS_TOKEN }}
        run: |
          if [ -n "$STANDARDS_TOKEN" ]; then
            AUTH="url.https://x-access-token:${STANDARDS_TOKEN}@github.com/.insteadOf=https://github.com/"
            git -c "http.https://github.com/.extraheader=" -c "$AUTH" submodule update --init --recursive
          else
            git submodule update --init --recursive
          fi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Chặn tắt cảnh báo / bỏ qua test
        run: |
          if grep -rnE '#pragma warning disable|SuppressMessage\(|Skip *= *"' --include=*.cs --exclude-dir=Migrations --exclude-dir=bin --exclude-dir=obj src tests; then
            echo "::error::Không được tắt cảnh báo hoặc bỏ qua test. Sửa code cho đúng luật, hoặc đề xuất đổi luật trong engineering-standards."
            exit 1
          fi

      - run: dotnet restore

      - name: Build (cảnh báo = lỗi, gồm luật kiến trúc và API bị cấm)
        run: dotnet build --no-restore -c Release -warnaserror

      - name: Test (unit + architecture + integration với Testcontainers)
        run: dotnet test --no-build -c Release --logger trx --results-directory TestResults

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dotnet-test-results
          path: ${{ inputs.working-directory }}/TestResults
          if-no-files-found: ignore
